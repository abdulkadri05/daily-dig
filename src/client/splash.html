<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>Take Sides</title>
  </head>
  <body class="app">
    <div class="content">
      <div class="tug" aria-hidden="true">
        <div class="team left">
          <span class="fig"></span><span class="fig"></span><span class="fig"></span>
        </div>
        <div class="rope"><span class="flag">🚩</span></div>
        <div class="team right">
          <span class="fig"></span><span class="fig"></span><span class="fig"></span>
        </div>
      </div>
      <h1 class="title" id="title">Take Sides</h1>
      <p class="description" id="description">
        Daily debate. Pick a side, write one line, watch upvotes pull the rope.
      </p>
    </div>
    <button class="start-button" id="start-button">🪢 Take a side</button>
    <footer class="footer">
      <div class="docs-link" tabindex="0" id="rules-link">How to play</div>
    </footer>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
